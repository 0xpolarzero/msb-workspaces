  <rect x="4" y="4" width="120" height="120" rx="27" fill="#171a1e"/>
  <rect x="6" y="6" width="116" height="116" rx="25" fill="none" stroke="#34383d" stroke-width="2"/>
  <g fill="none" stroke="#f3eee4" stroke-width="7" stroke-linecap="round">
    <circle cx="64" cy="64" r="39" stroke-dasharray="200 46" transform="rotate(-28 64 64)"/>
    <circle cx="64" cy="64" r="26" stroke-dasharray="126 37" transform="rotate(63 64 64)"/>
    <circle cx="64" cy="64" r="13" stroke="#ff9f0a" stroke-dasharray="58 24" transform="rotate(154 64 64)"/>
  </g>
</svg>
